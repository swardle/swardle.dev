<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vector Fury - Cross-Platform Test Runner</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top, 16px));
            padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
            background: #06090c;
            color: #d8f8ff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        h1 { margin: 0 0 8px 0; color: #0ff; font-size: 1.35rem; }
        .meta {
            background: #0c141a;
            border: 1px solid #1e3b46;
            padding: 10px 12px;
            margin-bottom: 12px;
            word-break: break-word;
            font-size: 12px;
            color: #9dc;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            align-items: center;
        }
        button {
            background: #000;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0ff; color: #000; }
        a.back-link {
            color: #ff0;
            text-decoration: none;
            border: 1px solid #ff0;
            padding: 8px 12px;
        }
        .fingerprint {
            background: #081812;
            border: 2px solid #0f0;
            color: #7f7;
            padding: 10px 12px;
            margin-bottom: 14px;
            word-break: break-all;
        }
        .fingerprint.fail {
            background: #1a0808;
            border-color: #f44;
            color: #f88;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #090e12;
        }
        th, td {
            border: 1px solid #1f333d;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #10202a; color: #0ff; }
        .pass { color: #0f0; font-weight: bold; }
        .fail { color: #f55; font-weight: bold; }
        .detail { color: #bcd; font-size: 12px; word-break: break-word; }
        #sandbox-frame {
            width: 390px;
            height: 700px;
            border: 1px solid #234;
            position: fixed;
            left: -9999px;
            top: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>VECTOR FURY — ZERO-DEPENDENCY TEST RUNNER</h1>
        <div class="meta" id="env-info">Detecting device...</div>

        <div class="toolbar">
            <button id="run-btn">Re-Run All Tests</button>
            <a class="back-link" href="index.html?dev=1">Open Game (?dev=1)</a>
            <a class="back-link" href="../">Arcade Menu</a>
            <span id="summary-text">Running...</span>
        </div>

        <div class="fingerprint" id="fingerprint-box">
            Cross-Engine Determinism Fingerprint: computing...
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:72px;">Status</th>
                    <th>Test</th>
                    <th>Detail</th>
                    <th style="width:78px;">Time</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>

    <!-- Offscreen mobile-sized iframe to run real DOM / CSS / Replay / Input checks -->
    <iframe id="sandbox-frame" title="Game DOM Test Sandbox"></iframe>

    <script src="../shared/math.js"></script>
    <script src="../shared/rng.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/replay.js"></script>
    <script src="js/debug.js"></script>
    <script src="js/render.js"></script>
    <script src="../tests/vector_fury_suite.js"></script>

    <script>
        (function () {
            var envInfo = document.getElementById('env-info');
            var runBtn = document.getElementById('run-btn');
            var summaryText = document.getElementById('summary-text');
            var fpBox = document.getElementById('fingerprint-box');
            var resultsBody = document.getElementById('results-body');
            var frameEl = document.getElementById('sandbox-frame');

            var touchCapable = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            envInfo.textContent =
                'Viewport: ' + window.innerWidth + 'x' + window.innerHeight +
                ' | DPR: ' + (window.devicePixelRatio || 1) +
                ' | Touch: ' + (touchCapable ? 'yes' : 'no') +
                ' | UA: ' + navigator.userAgent;

            function addRow(r) {
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td class="' + (r.passed ? 'pass' : 'fail') + '">' + (r.passed ? 'PASS' : 'FAIL') + '</td>' +
                    '<td>' + escapeHtml(r.name) + '</td>' +
                    '<td class="detail">' + escapeHtml(r.detail) + '</td>' +
                    '<td>' + r.ms + ' ms</td>';
                resultsBody.appendChild(tr);
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            // Browser-only live DOM & layout smoke test inside an iPhone-sized iframe
            function runBrowserDomTests(done) {
                var domResults = [];
                var t0 = performance.now();
                var pageErrors = [];

                frameEl.onload = function () {
                    var win = frameEl.contentWindow;
                    var doc = frameEl.contentDocument;

                    win.addEventListener('error', function (e) {
                        pageErrors.push(e.message || 'Uncaught error');
                    });

                    // Give attract demo a few frames to render
                    setTimeout(function () {
                        // Check 1: Game loads cleanly with zero errors & canvas has HiDPI backing size
                        try {
                            var canvas = doc.getElementById('gameCanvas');
                            vfAssert(pageErrors.length === 0, 'Uncaught errors: ' + pageErrors.join('; '));
                            vfAssert(canvas && canvas.width > 0 && canvas.height > 0, 'Canvas backing dimensions invalid');
                            var devBtn = doc.getElementById('hud-menu-btn');
                            vfAssert(devBtn && devBtn.textContent.indexOf('DEV') !== -1, 'Expected MENU [DEV] in ?dev=1 mode');
                            domResults.push({
                                name: '[Browser] Game loads cleanly & HiDPI canvas ready',
                                passed: true,
                                detail: 'canvas=' + canvas.width + 'x' + canvas.height + ' (CSS ' + canvas.clientWidth + 'x' + canvas.clientHeight + ')',
                                ms: Math.round((performance.now() - t0) * 100) / 100
                            });
                        } catch (err) {
                            domResults.push({
                                name: '[Browser] Game loads cleanly & HiDPI canvas ready',
                                passed: false,
                                detail: err.message,
                                ms: Math.round((performance.now() - t0) * 100) / 100
                            });
                        }

                        // Check 2: Mobile controls hide when Replay mode opens (no overlap with #replay-bar)
                        var t1 = performance.now();
                        try {
                            doc.body.classList.add('mobile-controls-visible');
                            doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'r', code: 'KeyR', bubbles: true }));
                            var replayBar = doc.getElementById('replay-bar');
                            var mobileControls = doc.getElementById('mobile-controls');
                            var replayVisible = win.getComputedStyle(replayBar).display !== 'none';
                            var mobileHidden  = win.getComputedStyle(mobileControls).display === 'none';
                            // Exit replay
                            doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'r', code: 'KeyR', bubbles: true }));

                            // Note: on title screen, R only opens replay after starting demo/game; click Watch AI Demo if needed
                            if (!replayVisible) {
                                doc.getElementById('demo-button').click();
                                doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'r', code: 'KeyR', bubbles: true }));
                                replayVisible = win.getComputedStyle(replayBar).display !== 'none';
                                mobileHidden  = win.getComputedStyle(mobileControls).display === 'none';
                            }

                            vfAssert(replayVisible, 'Replay bar failed to open on R key');
                            vfAssert(mobileHidden, 'Mobile controls overlapped Replay bar instead of hiding');
                            domResults.push({
                                name: '[Browser] Mobile controls hide cleanly during Replay',
                                passed: true,
                                detail: 'replay-bar visible & mobile-controls display:none on 390x700 viewport',
                                ms: Math.round((performance.now() - t1) * 100) / 100
                            });
                        } catch (err2) {
                            domResults.push({
                                name: '[Browser] Mobile controls hide cleanly during Replay',
                                passed: false,
                                detail: err2.message,
                                ms: Math.round((performance.now() - t1) * 100) / 100
                            });
                        }

                        done(domResults);
                    }, 220);
                };

                frameEl.src = 'index.html?dev=1&t=' + Date.now();
            }

            function executeAll() {
                resultsBody.innerHTML = '';
                summaryText.textContent = 'Running...';
                fpBox.className = 'fingerprint';
                fpBox.textContent = 'Cross-Engine Determinism Fingerprint: computing...';

                setTimeout(function () {
                    var shared = runSharedTestSuite();
                    for (var i = 0; i < shared.results.length; i++) {
                        addRow(shared.results[i]);
                    }

                    runBrowserDomTests(function (domResults) {
                        var passed = shared.passed;
                        var total = shared.total + domResults.length;
                        for (var j = 0; j < domResults.length; j++) {
                            addRow(domResults[j]);
                            if (domResults[j].passed) passed++;
                        }

                        var allOk = (passed === total);
                        summaryText.textContent = (allOk ? 'ALL PASSED: ' : 'FAILURES: ') + passed + ' / ' + total;
                        summaryText.className = allOk ? 'pass' : 'fail';
                        fpBox.className = allOk ? 'fingerprint' : 'fingerprint fail';
                        fpBox.textContent = 'Cross-Engine Determinism Fingerprint (must match across Win/Mac/iOS/Android):\n' + shared.fingerprint;
                    });
                }, 20);
            }

            runBtn.addEventListener('click', executeAll);
            executeAll();
        })();
    </script>
</body>
</html>
