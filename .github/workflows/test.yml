name: Vector Fury Cross-OS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (built-in test runner, zero npm dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run zero-dependency test suite
        run: node tests/run_tests.js
